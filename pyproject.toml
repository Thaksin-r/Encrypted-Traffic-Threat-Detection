[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ettd"
version = "0.1.0"
description = "Encrypted Traffic Threat Detection without decryption"
requires-python = ">=3.10"
dependencies = [
    "scapy>=2.5.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "streamlit>=1.32.0",
    "httpx>=0.27.0",
    "openai-agents>=0.0.14",
    "openai>=1.30.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
    "joblib>=1.3.0",
    "plotly>=5.18.0",
    "networkx>=3.0",
]

[project.scripts]
ettd-extract = "ettd.cli:extract_main"
ettd-detect = "ettd.cli:detect_main"
ettd-pipeline = "ettd.cli:pipeline_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
